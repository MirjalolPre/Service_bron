spring.application.name=Service_bron

# Local .env file (optional). Real environment variables also work.
spring.config.import=optional:file:.env[.properties]

# --- Bot / app settings (values come from env vars or .env) ---
app.telegram.token=${TELEGRAM_BOT_TOKEN:}
app.telegram.username=${TELEGRAM_BOT_USERNAME:}
app.telegram.enabled=true
app.super-admin-ids=${SUPER_ADMIN_IDS:}
app.default-timezone=${APP_DEFAULT_TIMEZONE:Asia/Tashkent}

# --- Demo data for manual testing (off by default; see README) ---
app.demo-data.enabled=${DEMO_DATA:false}
app.demo-data.reset=${DEMO_DATA_RESET:false}
app.demo-data.staff-telegram-id=${DEMO_STAFF_TELEGRAM_ID:}

# --- Java 21 virtual threads ---
spring.threads.virtual.enabled=true

# --- Database (dev: Docker Compose support configures the datasource) ---
spring.docker.compose.lifecycle-management=start-only
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Logging ---
logging.level.pdp.service_bron=INFO
